apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: lcat
  namespace: argocd
  annotations:
    kubernetes.io/description: "Home for my self-hosted apps"
spec:
  sourceRepos:
    - "https://github.com/lc-at/-kates.git"
    - "https://pkgs.tailscale.com/helmcharts"
    - "https://traefik.github.io/charts"
  destinations:
    - namespace: "*"
      server: "https://kubernetes.default.svc"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
