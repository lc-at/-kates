apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-kubernetes-operator
  namespace: argocd
  labels:
    name: tailscale
spec:
  project: lcat
  source:
    repoURL: https://pkgs.tailscale.com/helmcharts
    targetRevision: 1.98.4
    chart: tailscale-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
