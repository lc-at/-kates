apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: lcat
  source:
    repoURL: https://traefik.github.io/charts
    targetRevision: 41.0.1
    chart: traefik
    helm:
      values: |
        deployment:
          kind: Deployment
          replicas: 2
        service:
          enabled: true
          type: LoadBalancer
          annotations:
            tailscale.com/expose: "true"
        ports:
          web:
            port: 80
            nodePort: 30000
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true

          websecure:
            port: 443
            nodePort: 30001

        api:
          dashboard: true
          insecure: false

        ingressRoute:
          dashboard:
            enabled: true
            matchRule: Host(`traefik.lcat.dev`)
            entryPoints:
              - websecure

        ingressClass:
          enabled: true
          isDefaultClass: true

        gateway:
          listeners:
            web:
              port: 80
              protocol: HTTP
              namespacePolicy:
                from: All
            websecure:
              port: 443
              protocol: HTTPS
              namespacePolicy:
                from: All
              mode: Terminate
              certificateRefs:
                - kind: Secret
                  name: lcat-dev-wildcard-tls
                  group: ""

        providers:
          kubernetesCRD:
            enabled: true
          kubernetesIngress:
            enabled: true
          kubernetesGateway:
            enabled: true

        log:
          level: INFO

        accessLog:
          enabled: true

        extraObjects:
          - apiVersion: cert-manager.io/v1
            kind: Certificate
            metadata:
              name: lcat-dev-wildcard
            spec:
              secretName: lcat-dev-wildcard-tls
              issuerRef:
                name: letsencrypt-prod-acmedns
                kind: ClusterIssuer
              dnsNames:
                - "*.lcat.dev"

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
