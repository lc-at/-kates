apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
  annotations:
    kubernetes.io/description: ApplicationSet for all my apps and operators
spec:
  generators:
    - git:
        repoURL: https://github.com/lc-at/-kates.git
        revision: HEAD
        directories:
          - path: apps/*
          - path: platform/*
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: lcat
      source:
        repoURL: https://github.com/lc-at/-kates.git
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
