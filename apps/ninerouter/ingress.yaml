apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ninerouter
  namespace: ninerouter
  labels:
    app.kubernetes.io/name: ninerouter
    app.kubernetes.io/part-of: ninerouter
    app.kubernetes.io/component: web
  annotations:
    kubernetes.io/description: "External HTTPS ingress for 9router"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - 9router.lcat.dev
  rules:
    - host: 9router.lcat.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ninerouter
                port:
                  number: 80
