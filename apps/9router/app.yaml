apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: 9router-data
  namespace: 9router
  labels:
    app.kubernetes.io/name: 9router
    app.kubernetes.io/part-of: 9router
    app.kubernetes.io/component: app
  annotations:
    kubernetes.io/description: "Persistent data volume for 9router data directory"
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: 9router
  namespace: 9router
  labels:
    app.kubernetes.io/name: 9router
    app.kubernetes.io/part-of: 9router
    app.kubernetes.io/component: web
  annotations:
    kubernetes.io/description: "Cluster-internal 9router web service."
spec:
  ports:
    - port: 8080
  selector:
    app.kubernetes.io/name: 9router
    app.kubernetes.io/component: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: 9router
  namespace: 9router
  labels:
    app.kubernetes.io/name: 9router
    app.kubernetes.io/part-of: 9router
    app.kubernetes.io/component: web
  annotations:
    kubernetes.io/description: "9router application deployment"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: 9router
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: 9router
        app.kubernetes.io/part-of: 9router
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: 9router
          image: ghcr.io/decolua/9router:0.5.4
          ports:
            - containerPort: 20128
          env:
            - name: DATA_DIR
              value: "/app/data"
          volumeMounts:
            - name: data
              mountPath: "/app/data"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 20128
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 20128
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: 9router-data
