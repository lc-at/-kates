name: Validate Kubernetes Manifests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Build all kustomizations
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          failed=0
          mapfile -t dirs < <(find . -path ./.git -prune -o -name kustomization.yaml -printf '%h\n' | sort)

          for dir in "${dirs[@]}"; do
            name="${dir//\//-}"
            name="${name#.}"
            name="${name#-}"
            name="${name:-root}"

            echo "::group::Build: $dir"
            if kubectl kustomize "$dir" > "/tmp/out/${name}.yaml"; then
              echo "OK"
            else
              echo "::error::Build failed for $dir"
              failed=1
            fi
            echo "::endgroup::"
          done

          [ "$failed" -eq 0 ] || exit 1


      - name: Validate schemas
        run: |
          set -euo pipefail
          kubeconform -strict -summary -ignore-missing-schemas /tmp/out/*.yaml
